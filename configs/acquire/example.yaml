# Fetches terrain + optical inputs for a render; each run writes into its own
# folder out/runs/<time>-acquire/ (cache shared in out/_acquire/), and
# out/runs/latest-acquire points at the newest. Run standalone with
# `eo-art-f3d acquire configs/acquire/example.yaml`, or chained ahead of a
# render with `eo-art-f3d run <render-config> --acquire
# configs/acquire/example.yaml`. --out overrides out_dir below either way.

aoi_path: aoi.gpkg   # override with --set aoi_path=...
ee_project: your-ee-project
out_dir: out

# Path to a local checkout of the sentinel_sr project (it ships its own
# torch/cubo/mlstac stack in an isolated venv rather than eo-art's).
sentinel_sr_dir: ../sentinel_sr

sentinel:
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  model_path: /path/to/LDSRS2-SEN2SR
  max_items: 10
  max_cloud_cover: 20
  # Large AOIs: without zones only one edge_size x resolution chip (1.28 km)
  # around the AOI's center is super-resolved. Zones cover the whole AOI with
  # such chips, run one after another (max_items applies per zone), and write
  # <aoi>_sr_zones/ (tiles + VRT) into the run folder out/runs/<time>-<kind>/. Acquire then builds the DTM natively over
  # all zones (dtm.mode is ignored); `run --acquire` adds one overlay per tile,
  # aligned to the DTM at render time.
  # zones:
  #   enabled: true
  #   clip_to_aoi: true   # skip grid cells outside an irregular AOI
  #   mosaic: false       # also write <aoi>_sr_mosaic.tif
  # Zones + timeseries: one shared step per interval. The zones are fetched at
  # 10 m, mosaicked per step, co-registered (coreg) and super-resolved as one
  # image, so zone borders leave no seam; each step is <aoi>_sr_<date>.tif.
  # Either the zones' dates at most max_zone_offset_days apart where possible
  # (steps.json reports the actual spread), or single_date: one acquisition
  # for the whole AOI (intervals without a day shared by all zones are skipped).
  # timeseries:
  #   enabled: true
  #   interval: month
  #   max_zone_offset_days: 14   # or: single_date: true
  # coreg:                       # AROSICS at 10 m before SR (stac2cube engine)
  #   enabled: true
  #   anchor: auto               # auto | first | composite | YYYY-MM-DD
  #   grid_size: 7               # up to grid_size^2 + 1 windows per step

dem:
  # FABDEM is Copernicus GLO-30 with forest canopy and buildings removed --
  # same 30 m posting, but no tree-height noise stippling the surface.
  source: fabdem
  scale: 30

dtm:
  apply_erosion: true
  erosion_kwargs:
    iterations: 30

align:
  resampling: bilinear
