[project]
name = "eo-art-sentinel-sr"
version = "0.1.0"
description = "Sentinel-2 RGBN super-resolution, isolated from eo-art's core dependency stack"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cubo>=2026.2.0",
    "mlstac>=0.4.9",
    "opensr-model>=1.1.1",
    "sen2sr>=0.6.1",
    "stac2cube[tools,geo,io,coreg,ml,notebook]",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "vecraspy",
    "rasterio>=1.4.0",
    "rioxarray>=0.17.0",
    "xarray>=2024.1.0",
]

[project.scripts]
eo-art-sentinel-sr = "sentinel_sr.cli:main"

[tool.uv.sources]
stac2cube = { git = "https://github.com/BaturalpArisoy/stac2cube.git" }
vecraspy = { git = "https://github.com/kwundram2602/vecraspy.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_sr"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
