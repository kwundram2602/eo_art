run:
  name: run
  out_dir: out
  cache: true
  fail_fast: false
input:
  path: /tmp/pytest-of-kjell/pytest-48/test_bad_overlay_prep_op_fails0/dem.tif
prepare: []
overlays:
- name: ndvi
  path: /tmp/pytest-of-kjell/pytest-48/test_bad_overlay_prep_op_fails0/overlay.tif
  prepare:
  - op: nope
  opacity: null
  z_order: null
  extent: null
render:
  width: 1200
  height: 720
  snapshot_name: snapshot.png
  camera:
    phi: 300.0
    theta: 10.5
    radius: 26000.0
    fov: 60.0
  sun:
    azimuth: 305.0
    elevation: 24.0
    intensity: 1.0
    ambient: 0.05
  terrain:
    zscale: 3.0
  pbr:
    enabled: true
    shadow_technique: pcss
    shadow_map_res: 4096
    exposure: 1.35
    msaa: 8
    ibl_intensity: 1.0
    normal_strength: 1.1
    height_ao:
      enabled: true
      directions: 6
      steps: 16
      max_distance: 200.0
      strength: 1.2
      resolution_scale: 0.5
    sun_visibility:
      enabled: true
      mode: soft
      samples: 4
      steps: 24
      max_distance: 400.0
      softness: 1.0
      bias: 0.01
      resolution_scale: 0.5
    materials:
