      distortion: 0.0
      chromatic_aberration: 0.0
      vignette_strength: 0.25
      vignette_radius: 0.7
      vignette_softness: 0.3
    sky:
      enabled: true
      turbidity: 2.5
      ground_albedo: 0.3
      sun_intensity: 1.0
      aerial_perspective: true
      sky_exposure: 1.0
  overlay_preserve_colors: false
animation:
  kind: none
  fps: 30
  orbit:
    duration: 8.0
    phi_start: 0.0
    phi_end: 360.0
    theta_start: 12.0
    theta_end: null
    radius_start: 26000.0
    radius_end: null
    fov_start: 60.0
    fov_end: null
export:
  video:
    enabled: false
    format: mp4
    fps: 30
    quality: 8
sweep: null
