[project]
name = "eo-art"
version = "0.1.0"
description = "Earth Observation art — a Python library for creating art from EO data"
readme = "README.md"
authors = [
    { name = "kwundram2602", email = "134778951+kwundram2602@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "vecraspy",
    "xarray>=2024.1.0",
    "rioxarray>=0.17.0",
    "rasterio>=1.4.0",
    "geopandas>=1.0.0",
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "imageio>=2.34.0",
    "pyyaml>=6.0",
    "forge3d>=1.34.0",
    "omegaconf>=2.3.1",
]

[project.optional-dependencies]
hillshade = ["xarray-spatial>=0.3.0"]
stac      = ["pystac-client>=0.8.0", "planetary-computer>=1.0.0"]
dem       = ["py3dep>=0.17.0"]
3d        = ["pyvista>=0.44.0", "trimesh>=4.4.0"]
neural    = ["torch>=2.0", "torchvision>=0.15"]
video = [
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
install-local = "scripts.install_local:main"
ship = "scripts.ship:main"
add-git-ref = "scripts.add_git_ref:main"
eo-art-f3d = "eo_art.forge3d_pipes.cli:main"

[project.urls]
Homepage = ""
Repository = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_art", "scripts"]

[tool.ruff]
line-length    = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a GPU and spawns the forge3d viewer subprocess"]
addopts = "-m 'not gpu'"

[tool.uv.sources]
vecraspy = { git = "https://github.com/kwundram2602/vecraspy.git" }
